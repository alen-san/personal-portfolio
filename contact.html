<body>

    <header>

    <main>

        <section id="contact">

            <h2>Get in Touch</h2>

            <p>
                Feel free to contact me using the form below.
            </p>


            <form id="contactForm">

                <label for="name">Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name">

                <p class="error-msg" id="nameError"></p>


                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email">

                <p class="error-msg" id="emailError"></p>


                <p>Reason for Contact:</p>


                <div class="radio-group">

                    <input
                        type="radio"
                        id="general"
                        name="reason"
                        value="general">

                    <label for="general">General</label>


                    <input
                        type="radio"
                        id="opportunity"
                        name="reason"
                        value="opportunity">

                    <label for="opportunity">Opportunity</label>

                </div>


                <label for="message">Message:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Enter your message">
                </textarea>

                <p class="error-msg" id="messageError"></p>


                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="agree"
                        name="agree">

                    <label for="agree">
                        I agree to share my information.
                    </label>

                </div>

                <p class="error-msg" id="formSuccess"></p>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>
